<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Løpespiller</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b22;
    --line: #2a2f3a;
    --text: #f2f4f7;
    --muted: #9aa3b2;
    --accent: #ff7a1a;
    --accent-ink: #1a0c00;
    --ok: #46c37b;
    --warn: #ffb020;
    --radius: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 14px;
    max-width: 560px; margin: 0 auto;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; }
  h1 { font-size: 22px; margin: 0; letter-spacing: .3px; }
  .ver { color: var(--muted); font-size: 13px; }

  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px 16px;
  }
  .src-label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .src-name { font-size: 17px; font-weight: 600; margin-top: 2px; word-break: break-word; }
  .src-name.tmp { color: var(--warn); }

  .now { text-align: center; padding: 22px 16px 18px; }
  .title { font-size: 24px; font-weight: 700; line-height: 1.25; min-height: 2.5em;
           display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .sub { color: var(--muted); margin-top: 6px; font-size: 14px; min-height: 1.4em;
         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .bar { margin-top: 18px; }
  input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
  .times { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

  .controls { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 12px; align-items: center; }
  .btn {
    appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--text);
    border-radius: var(--radius); font: inherit; font-weight: 600; cursor: pointer;
    min-height: 56px; padding: 10px 14px; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .4; }
  .ctl { min-height: 84px; }
  .ctl svg { width: 38px; height: 38px; fill: currentColor; }
  .play { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); min-height: 104px; border-radius: 28px; }
  .play svg { width: 52px; height: 52px; }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .toggle[aria-pressed=true] { border-color: var(--accent); color: var(--accent); }
  .full { width: 100%; }

  details.card summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
  details.card summary::after { content: "▾"; color: var(--muted); }
  details[open].card summary::after { content: "▴"; }
  .stack { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .note { color: var(--muted); font-size: 13px; }
  .danger { color: #ff8a8a; }

  .status { font-size: 14px; color: var(--muted); text-align: center; min-height: 1.4em; }
  .status.err { color: #ff8a8a; }
  progress { width: 100%; accent-color: var(--accent); }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <header>
    <h1>Løpespiller</h1>
    <span class="ver" id="ver"></span>
  </header>

  <section class="card">
    <div class="src-label" id="srcLabel">Kilde</div>
    <div class="src-name" id="srcName">Laster …</div>
  </section>

  <section class="card now">
    <div class="title" id="title">Ingen sang</div>
    <div class="sub" id="sub">&nbsp;</div>
    <div class="bar">
      <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Posisjon">
      <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    </div>
  </section>

  <section class="controls">
    <button class="btn ctl" id="prev" aria-label="Forrige">
      <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 6v12z"/></svg>
    </button>
    <button class="btn ctl play" id="play" aria-label="Spill">
      <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="btn ctl" id="next" aria-label="Neste">
      <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
    </button>
  </section>

  <section class="row">
    <button class="btn toggle" id="shuffle" aria-pressed="true">⤮ Shuffle</button>
    <button class="btn" id="pickTmp">Annen mappe …</button>
  </section>
  <button class="btn full hidden" id="backStd">↩ Tilbake til standardmappe</button>

  <div class="status" id="status"></div>

  <details class="card" id="settings">
    <summary>Standardmappe</summary>
    <div class="stack">
      <div class="note">
        Standardmappa kopieres inn i appen én gang. Da er den klar hver gang du åpner appen,
        også uten nett. Sangene tar da plass to steder på telefonen.
      </div>
      <button class="btn full" id="pickStd">Velg standardmappe …</button>
      <div id="importBox" class="hidden">
        <progress id="importProg" max="1" value="0"></progress>
        <div class="note" id="importText"></div>
      </div>
      <div class="note" id="storageInfo"></div>
      <button class="btn full danger" id="clearStd">Fjern standardmappe fra appen</button>
    </div>
  </details>

  <input type="file" id="dirStd" webkitdirectory multiple class="hidden">
  <input type="file" id="dirTmp" webkitdirectory multiple class="hidden">
  <audio id="audio" preload="auto"></audio>

<script>
"use strict";
const VERSION = "1.0.0";
const AUDIO_EXT = /\.(mp3|m4a|aac|ogg|oga|opus|flac|wav|webm|mp4|3gp)$/i;
const $ = (id) => document.getElementById(id);
const audio = $("audio");
$("ver").textContent = "v" + VERSION;

/* ---------- Lagring (IndexedDB) ---------- */
const DB_NAME = "lopespiller";
let dbPromise = null;
function db() {
  if (!dbPromise) {
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => {
        const d = req.result;
        d.createObjectStore("songs", { keyPath: "id" });   // metadata
        d.createObjectStore("blobs", { keyPath: "id" });   // lydfiler
        d.createObjectStore("meta");                       // bibliotekinfo
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  return dbPromise;
}
function tx(stores, mode, fn) {
  return db().then((d) => new Promise((resolve, reject) => {
    const t = d.transaction(stores, mode);
    let result;
    Promise.resolve(fn(t)).then((r) => { result = r; });
    t.oncomplete = () => resolve(result);
    t.onerror = () => reject(t.error);
    t.onabort = () => reject(t.error || new Error("Avbrutt"));
  }));
}
function reqP(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }

async function loadLibrary() {
  const d = await db();
  const t = d.transaction(["songs", "meta"], "readonly");
  const songs = await reqP(t.objectStore("songs").getAll());
  const name = await reqP(t.objectStore("meta").get("name"));
  return { name: name || "", songs };
}
async function getBlob(id) {
  const d = await db();
  const row = await reqP(d.transaction("blobs").objectStore("blobs").get(id));
  return row ? row.blob : null;
}
async function clearLibrary() {
  await tx(["songs", "blobs", "meta"], "readwrite", (t) => {
    t.objectStore("songs").clear();
    t.objectStore("blobs").clear();
    t.objectStore("meta").clear();
  });
}

/* ---------- Hjelpere ---------- */
function audioFiles(fileList) {
  return Array.from(fileList).filter((f) => AUDIO_EXT.test(f.name) || (f.type && f.type.startsWith("audio/")));
}
function folderOf(f) {
  const p = f.webkitRelativePath || "";
  const parts = p.split("/");
  return parts.length > 1 ? parts.slice(0, -1).join("/") : "";
}
function rootName(files) {
  const p = files[0] && files[0].webkitRelativePath;
  return p ? p.split("/")[0] : "Valgte filer";
}
function niceName(name) { return name.replace(/\.[^.]+$/, "").replace(/_/g, " "); }
function fmt(s) {
  if (!isFinite(s) || s < 0) s = 0;
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(sec).padStart(2, "0");
}
function mb(bytes) { return (bytes / 1048576).toLocaleString("nb-NO", { maximumFractionDigits: 0 }) + " MB"; }
function store(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
function recall(key, def) { try { const v = localStorage.getItem(key); return v === null ? def : JSON.parse(v); } catch (e) { return def; } }
function status(msg, err) { const s = $("status"); s.textContent = msg || ""; s.classList.toggle("err", !!err); }
const collator = new Intl.Collator("nb", { numeric: true, sensitivity: "base" });

/* ---------- Spillerstatus ---------- */
let source = "std";          // "std" | "tmp"
let stdLib = { name: "", songs: [] };
let tracks = [];             // aktiv liste: {id, name, folder, file?}
let order = [];              // indekser inn i tracks
let pos = -1;                // posisjon i order
let shuffleOn = recall("shuffle", true);
let curUrl = null;
let errorsInRow = 0;
let loadToken = 0;

function buildOrder(keepCurrent) {
  const n = tracks.length;
  const current = (pos >= 0 && order[pos] !== undefined) ? order[pos] : -1;
  order = Array.from({ length: n }, (_, i) => i);
  if (shuffleOn) {
    for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  } else {
    order.sort((a, b) => collator.compare((tracks[a].folder + "/" + tracks[a].name), (tracks[b].folder + "/" + tracks[b].name)));
  }
  if (keepCurrent && current >= 0) {
    const k = order.indexOf(current);
    if (shuffleOn) { order.splice(k, 1); order.unshift(current); pos = 0; }
    else pos = k;
  } else {
    pos = -1;
  }
}

function setTracks(list, src) {
  stop();
  source = src;
  tracks = list;
  pos = -1;
  buildOrder(false);
  renderSource();
  renderNow(null);
}

function renderSource() {
  const tmp = source === "tmp";
  $("srcLabel").textContent = tmp ? "Midlertidig mappe" : "Standardmappe";
  const name = tmp ? tmpName : (stdLib.name || "");
  $("srcName").classList.toggle("tmp", tmp);
  if (!tracks.length) {
    $("srcName").textContent = tmp ? "Ingen lydfiler i mappa" : "Ikke valgt ennå";
  } else {
    $("srcName").textContent = name + " · " + tracks.length + " " + (tracks.length === 1 ? "sang" : "sanger");
  }
  $("backStd").classList.toggle("hidden", !tmp);
  if (!tracks.length && !tmp) $("settings").open = true;
}

function renderNow(t) {
  $("title").textContent = t ? niceName(t.name) : (tracks.length ? "Trykk spill for å starte" : "Ingen sang");
  $("sub").textContent = t ? (t.folder || "") : "";
  if (!t) { $("cur").textContent = "0:00"; $("dur").textContent = "0:00"; $("seek").value = 0; }
}

function setPlayIcon(playing) {
  $("playIcon").innerHTML = playing
    ? '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
  $("play").setAttribute("aria-label", playing ? "Pause" : "Spill");
  if ("mediaSession" in navigator) navigator.mediaSession.playbackState = playing ? "playing" : "paused";
}

async function urlFor(t) {
  if (t.file) return URL.createObjectURL(t.file);
  const blob = await getBlob(t.id);
  if (!blob) throw new Error("Fant ikke filen i appens lagring");
  return URL.createObjectURL(blob);
}

async function loadAt(newPos, autoplay) {
  if (!tracks.length) return;
  if (newPos >= order.length) { buildOrder(false); newPos = 0; }   // ny runde, ny blanding
  if (newPos < 0) newPos = 0;
  pos = newPos;
  const t = tracks[order[pos]];
  const token = ++loadToken;
  renderNow(t);
  try {
    const url = await urlFor(t);
    if (token !== loadToken) { URL.revokeObjectURL(url); return; }
    if (curUrl) URL.revokeObjectURL(curUrl);
    curUrl = url;
    audio.src = url;
    updateMetadata(t);
    if (autoplay) await audio.play();
    status("");
  } catch (e) {
    if (token !== loadToken) return;
    if (e && e.name === "NotAllowedError") { status("Trykk spill for å starte"); return; }
    status("Kunne ikke spille «" + t.name + "», hopper over", true);
    skipAfterError();
  }
}

function skipAfterError() {
  errorsInRow++;
  if (errorsInRow >= Math.min(10, tracks.length)) { status("For mange filer som ikke kan spilles. Stoppet.", true); errorsInRow = 0; setPlayIcon(false); return; }
  setTimeout(() => loadAt(pos + 1, true), 400);
}

function play() {
  if (!tracks.length) { status("Velg en mappe først", true); return; }
  if (pos < 0 || !audio.src) { loadAt(0, true); return; }
  audio.play().catch(() => status("Trykk spill for å starte"));
}
function pause() { audio.pause(); }
function toggle() { audio.paused ? play() : pause(); }
function next() { if (tracks.length) loadAt(pos + 1, true); }
function prev() {
  if (!tracks.length) return;
  if (audio.currentTime > 3 || pos <= 0) { audio.currentTime = 0; if (audio.paused) play(); return; }
  loadAt(pos - 1, true);
}
function stop() {
  loadToken++;
  audio.pause();
  audio.removeAttribute("src");
  audio.load();
  if (curUrl) { URL.revokeObjectURL(curUrl); curUrl = null; }
  setPlayIcon(false);
}

/* ---------- Media Session: låseskjerm + headset ---------- */
function updateMetadata(t) {
  if (!("mediaSession" in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: niceName(t.name),
      artist: t.folder || (source === "tmp" ? tmpName : stdLib.name) || "Løpespiller",
      album: "Løpespiller",
      artwork: [
        { src: "icon-192.png", sizes: "192x192", type: "image/png" },
        { src: "icon-512.png", sizes: "512x512", type: "image/png" }
      ]
    });
  } catch (e) {}
}
function updatePosition() {
  if (!("mediaSession" in navigator) || !navigator.mediaSession.setPositionState) return;
  if (!isFinite(audio.duration) || audio.duration <= 0) return;
  try {
    navigator.mediaSession.setPositionState({
      duration: audio.duration, playbackRate: audio.playbackRate || 1,
      position: Math.min(audio.currentTime, audio.duration)
    });
  } catch (e) {}
}
if ("mediaSession" in navigator) {
  const h = (a, fn) => { try { navigator.mediaSession.setActionHandler(a, fn); } catch (e) {} };
  h("play", play);
  h("pause", pause);
  h("stop", pause);
  h("nexttrack", next);
  h("previoustrack", prev);
  h("seekto", (d) => { if (d.seekTime != null) { audio.currentTime = d.seekTime; updatePosition(); } });
  h("seekforward", (d) => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + (d.seekOffset || 10)); updatePosition(); });
  h("seekbackward", (d) => { audio.currentTime = Math.max(0, audio.currentTime - (d.seekOffset || 10)); updatePosition(); });
}

/* ---------- Lydhendelser ---------- */
audio.addEventListener("play", () => setPlayIcon(true));
audio.addEventListener("playing", () => { errorsInRow = 0; });
audio.addEventListener("pause", () => setPlayIcon(false));
audio.addEventListener("ended", () => next());
audio.addEventListener("error", () => { if (audio.getAttribute("src")) { status("Filen kan ikke spilles, hopper over", true); skipAfterError(); } });
audio.addEventListener("loadedmetadata", () => { $("dur").textContent = fmt(audio.duration); updatePosition(); });
let seeking = false;
audio.addEventListener("timeupdate", () => {
  $("cur").textContent = fmt(audio.currentTime);
  if (!seeking && audio.duration) $("seek").value = Math.round(audio.currentTime / audio.duration * 1000);
});
$("seek").addEventListener("input", () => { seeking = true; if (audio.duration) $("cur").textContent = fmt($("seek").value / 1000 * audio.duration); });
$("seek").addEventListener("change", () => {
  if (audio.duration) audio.currentTime = $("seek").value / 1000 * audio.duration;
  seeking = false; updatePosition();
});

/* ---------- Knapper ---------- */
$("play").addEventListener("click", toggle);
$("next").addEventListener("click", next);
$("prev").addEventListener("click", prev);

function renderShuffle() { $("shuffle").setAttribute("aria-pressed", String(shuffleOn)); $("shuffle").textContent = shuffleOn ? "⤮ Shuffle på" : "→ Shuffle av"; }
$("shuffle").addEventListener("click", () => {
  shuffleOn = !shuffleOn; store("shuffle", shuffleOn); renderShuffle();
  buildOrder(true);
});

/* Midlertidig mappe: brukes bare til appen lukkes eller du går tilbake */
let tmpName = "";
$("pickTmp").addEventListener("click", () => { $("dirTmp").value = ""; $("dirTmp").click(); });
$("dirTmp").addEventListener("change", (e) => {
  const files = audioFiles(e.target.files);
  if (!e.target.files.length) return;
  if (!files.length) { status("Fant ingen lydfiler i mappa", true); return; }
  tmpName = rootName(files);
  setTracks(files.map((f, i) => ({ id: "tmp" + i, name: f.name, folder: folderOf(f), file: f })), "tmp");
  status("Midlertidig mappe valgt. Trykk spill.");
});
$("backStd").addEventListener("click", () => {
  setTracks(stdLib.songs.slice(), "std");
  status(stdLib.songs.length ? "Tilbake på standardmappa" : "");
});

/* Standardmappe: kopieres inn i appen */
let importing = false;
$("pickStd").addEventListener("click", () => { if (!importing) { $("dirStd").value = ""; $("dirStd").click(); } });
$("dirStd").addEventListener("change", async (e) => {
  if (!e.target.files.length) return;
  const files = audioFiles(e.target.files);
  if (!files.length) { status("Fant ingen lydfiler i mappa", true); return; }
  const total = files.reduce((s, f) => s + f.size, 0);
  try {
    if (navigator.storage && navigator.storage.estimate) {
      const est = await navigator.storage.estimate();
      const free = (est.quota || 0) - (est.usage || 0) + (await librarySize());
      if (est.quota && total > free) {
        status("Ikke nok plass: mappa er " + mb(total) + ", appen kan bruke ca. " + mb(free), true);
        return;
      }
    }
    if (!confirm("Kopiere " + files.length + " sanger (" + mb(total) + ") inn i appen? Gammel standardmappe erstattes.")) return;
    if (navigator.storage && navigator.storage.persist) { try { await navigator.storage.persist(); } catch (e2) {} }
    await importLibrary(files, rootName(files));
  } catch (err) {
    status("Kopiering feilet: " + (err && err.message ? err.message : err), true);
    importing = false; $("importBox").classList.add("hidden");
  }
});

async function librarySize() { return stdLib.songs.reduce((s, x) => s + (x.size || 0), 0); }

async function importLibrary(files, name) {
  importing = true;
  if (source === "std") stop();
  $("importBox").classList.remove("hidden");
  $("pickStd").disabled = true;
  await clearLibrary();
  stdLib = { name: "", songs: [] };
  const prog = $("importProg");
  prog.max = files.length; prog.value = 0;
  let done = 0, bytes = 0;
  for (const f of files) {
    const id = (f.webkitRelativePath || f.name) + "|" + f.size;
    const data = await f.arrayBuffer();                       // tving en ekte kopi
    const blob = new Blob([data], { type: f.type || "audio/mpeg" });
    const meta = { id, name: f.name, folder: folderOf(f), size: f.size };
    await tx(["songs", "blobs"], "readwrite", (t) => {
      t.objectStore("blobs").put({ id, blob });
      t.objectStore("songs").put(meta);
    });
    stdLib.songs.push(meta);
    done++; bytes += f.size;
    prog.value = done;
    $("importText").textContent = "Kopierer " + done + " av " + files.length + " · " + mb(bytes) + " av " + mb(files.reduce((s, x) => s + x.size, 0));
  }
  await tx(["meta"], "readwrite", (t) => { t.objectStore("meta").put(name, "name"); });
  stdLib.name = name;
  importing = false;
  $("pickStd").disabled = false;
  $("importBox").classList.add("hidden");
  if (source === "std") setTracks(stdLib.songs.slice(), "std");
  status("Standardmappe lagret: " + stdLib.songs.length + " sanger");
  renderStorage();
}

$("clearStd").addEventListener("click", async () => {
  if (importing) return;
  if (!stdLib.songs.length) { status("Ingen standardmappe å fjerne"); return; }
  if (!confirm("Fjerne standardmappa fra appen? Originalfilene på telefonen berøres ikke.")) return;
  if (source === "std") stop();
  await clearLibrary();
  stdLib = { name: "", songs: [] };
  if (source === "std") setTracks([], "std");
  status("Standardmappa er fjernet fra appen");
  renderStorage();
});

async function renderStorage() {
  let txt = stdLib.songs.length ? "Lagret i appen: " + stdLib.songs.length + " sanger, " + mb(await librarySize()) + "." : "Ingen standardmappe lagret.";
  try {
    if (navigator.storage && navigator.storage.persisted && await navigator.storage.persisted()) txt += " Lagringen er beskyttet mot automatisk opprydding.";
  } catch (e) {}
  $("storageInfo").textContent = txt;
}

/* ---------- Oppstart ---------- */
(async function init() {
  renderShuffle();
  if (!("webkitdirectory" in document.createElement("input"))) {
    status("Nettleseren støtter ikke mappevalg. Oppdater Chrome.", true);
  }
  try {
    stdLib = await loadLibrary();
  } catch (e) {
    status("Fikk ikke åpnet appens lagring", true);
  }
  setTracks(stdLib.songs.slice(), "std");
  renderStorage();
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
</body>
</html>
